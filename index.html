<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design - API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <header>
        <h1>QuickNotes API Client</h1>
        <p>Testing frontend integration with remote API</p>
    </header>

    <main>
        <!-- Create Note Section (Task 2) -->
        <section class="card-section">
            <h2>Create a Note</h2>
            <form id="note-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="title-input"
                        style="display: block; font-weight: bold; margin-bottom: 0.4rem;">Title:</label>
                    <input type="text" id="title-input" placeholder="Enter note title (max 100 chars)..."
                        style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="body-input"
                        style="display: block; font-weight: bold; margin-bottom: 0.4rem;">Body:</label>
                    <textarea id="body-input" placeholder="Enter note content (optional)..."
                        style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; min-height: 100px;"></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <!-- Load Notes Section -->
        <section class="card-section">
            <h2>Manage Notes</h2>
            <div class="actions-bar">
                <button id="load-btn" type="button">Load notes</button>
            </div>
            <p id="status" role="status"></p>
        </section>

        <!-- Notes List Section -->
        <section class="card-section">
            <h2>Notes List</h2>
            <ul id="notes-list">
                <li class="empty-state">No notes loaded yet. Click "Load notes" to fetch records.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>
</body>

</html>
